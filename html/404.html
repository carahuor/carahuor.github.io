<!DOCTYPE html>
<html>
    <head>
        <title>Page Not Found</title>
        <!--characters that can be used in HTML document-->
        <meta charset="utf-8" />
        <!--page made to match size of device screen-->
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    
        <!--link to stylesheet-->
        <link rel="stylesheet" href="/css/style.css" />
    
      <!--link to media queries-->
        <link rel="mediaqueries" href="/css/mediaqueries.css" />
    
        <!--link to JavaScript file-->
        <script src="/script.js" defer></script>
      </head>

      <body>
        <main>
            <div id="not-found-section">
              <div id="not-found-text">
                <h1>Oops!</h1>
                <h2>404 - Page Not Found</h2>
                <h3>The page may not be built yet or may have moved</h3>
                <button id="not-found-button" onclick="location.href='index.html'">Go to Home</button>
              </div>
            </div>
        </main>
      </body>
</html>
